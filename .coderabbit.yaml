# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI code review configuration for Nook.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.xcodeproj/**"
    - "!**/*.xcworkspace/**"
    - "!**/Package.resolved"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
  path_instructions:
    - path: "**/*"
      instructions: |
        Follow the rules in AGENTS.md. Everything written to the repository
        (code, identifiers, comments, docs, commit and PR text) must be in English.
    - path: "packages/protocol/**"
      instructions: |
        Security-sensitive code (ChaCha20-Poly1305 sealing, webhook security).
        Review carefully for nonce reuse, key handling, timing-safe comparisons and
        input validation.

chat:
  auto_reply: true
